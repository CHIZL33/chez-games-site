<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up & Auth - Chez Games</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .auth-container {
        max-width: 450px;
        margin: 80px auto;
        padding: 40px;
        background: var(--surface, #1e1e2f);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .auth-container h1 {
        margin-bottom: 24px;
        font-size: 1.8rem;
        color: #fff;
        text-align: center;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #cbd5e1;
        font-weight: 600;
      }
      .form-group input, .form-group textarea {
        width: 100%;
        padding: 12px 16px;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        color: #fff;
        font-size: 1rem;
      }
      .form-group input:focus, .form-group textarea:focus {
        outline: none;
        border-color: #6366f1;
      }
      .auth-btn {
        width: 100%;
        padding: 12px;
        background: #6366f1;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        font-size: 1rem;
        transition: background 0.2s;
      }
      .auth-btn:hover {
        background: #4f46e5;
      }
      .switch-mode {
        text-align: center;
        margin-top: 20px;
        color: #94a3b8;
      }
      .switch-mode a {
        color: #818cf8;
        text-decoration: none;
      }
      .switch-mode a:hover {
        text-decoration: underline;
      }
      .error-msg {
        color: #f87171;
        background: rgba(248, 113, 113, 0.1);
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 16px;
        display: none;
      }
      .success-msg {
        color: #4ade80;
        background: rgba(74, 222, 128, 0.1);
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 16px;
        display: none;
      }
      .nav-back {
        text-align: center;
        margin-bottom: 20px;
      }
      .nav-back a {
        color: #94a3b8;
        text-decoration: none;
      }
      .nav-back a:hover {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="nav-back">
        <a href="index.html">&larr; Back to Home</a>
      </div>
      <div id="error-box" class="error-msg"></div>
      <div id="success-box" class="success-msg"></div>

      <!-- Quick Netlify Identity Widget Launch -->
      <div style="text-align: center; margin-bottom: 24px;">
        <button id="open-identity-modal" class="auth-btn" style="background: #4f46e5; margin-bottom: 12px;">Open Login / Sign Up Modal</button>
        <p style="color: #94a3b8; font-size: 0.85rem;">Or use the form below:</p>
      </div>

      <!-- Sign Up Form -->
      <div id="signup-section">
        <h1>Create Account</h1>
        <form id="signup-form">
          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" required />
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" required />
          </div>
          <button type="submit" class="auth-btn">Sign Up</button>
        </form>
        <div class="switch-mode">
          Already have an account? <a href="#" id="to-login">Log In</a>
        </div>
      </div>

      <!-- Login Form -->
      <div id="login-section" style="display: none;">
        <h1>Welcome Back</h1>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required />
          </div>
          <button type="submit" class="auth-btn">Log In</button>
        </form>
        <div class="switch-mode">
          Don't have an account? <a href="#" id="to-signup">Sign Up</a>
        </div>
      </div>
    </div>

    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script type="module">
      import { signup, login, handleAuthCallback } from '@netlify/identity';

      const errorBox = document.getElementById('error-box');
      const successBox = document.getElementById('success-box');
      const signupSection = document.getElementById('signup-section');
      const loginSection = document.getElementById('login-section');

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', user => {
          if (user) window.location.href = 'dashboard.html';
        });
        window.netlifyIdentity.on('login', user => {
          window.location.href = 'dashboard.html';
        });
        document.getElementById('open-identity-modal').addEventListener('click', () => {
          window.netlifyIdentity.open();
        });
      }

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
        successBox.style.display = 'none';
      }

      function showSuccess(msg) {
        successBox.textContent = msg;
        successBox.style.display = 'block';
        errorBox.style.display = 'none';
      }

      document.getElementById('to-login').addEventListener('click', (e) => {
        e.preventDefault();
        signupSection.style.display = 'none';
        loginSection.style.display = 'block';
        errorBox.style.display = 'none';
        successBox.style.display = 'none';
      });

      document.getElementById('to-signup').addEventListener('click', (e) => {
        e.preventDefault();
        loginSection.style.display = 'none';
        signupSection.style.display = 'block';
        errorBox.style.display = 'none';
        successBox.style.display = 'none';
      });

      // Handle auth callback on load
      handleAuthCallback().then(result => {
        if (result) {
          showSuccess('Authentication action successful! Redirecting to dashboard...');
          setTimeout(() => window.location.href = 'dashboard.html', 1500);
        }
      }).catch(err => showError(err.message));

      document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        try {
          const user = await signup(email, password);
          if (user.emailVerified) {
            showSuccess('Account created! Redirecting...');
            setTimeout(() => window.location.href = 'dashboard.html', 1000);
          } else {
            showSuccess('Account created! Please check your email to confirm your account.');
          }
        } catch (err) {
          showError(err.message || 'Signup failed');
        }
      });

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        try {
          await login(email, password);
          showSuccess('Logged in successfully! Redirecting...');
          setTimeout(() => window.location.href = 'dashboard.html', 1000);
        } catch (err) {
          showError(err.message || 'Login failed');
        }
      });
    </script>
  </body>
</html>

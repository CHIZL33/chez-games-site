<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chez Games | Roblox Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 640px;
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 { color: #58a6ff; font-size: 2.2rem; margin-bottom: 12px; }
    p.lead { color: #8b949e; font-size: 1.1rem; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: #238636;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #2ea043; }
    .info {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #30363d;
      font-size: 0.9rem;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chez Games</h1>
    <p class="lead">Independent Roblox game development studio creating interactive experiences and games.</p>
    <a href="https://www.roblox.com" class="btn" target="_blank">View Our Roblox Group</a>
    <div class="info">
      Contact: <strong>founder@chez.games</strong>
    </div>
  </div>
</body>
</html>
